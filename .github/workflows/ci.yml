name: CI/CD Pipeline — Wellness Platform

on:
  push:
    branches: [ main, 'chore/**', 'feature/**', 'sprint-**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend Validation (FastAPI + Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: wellness_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify Backend Import & Module Structure
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/wellness_test_db"
          SECRET_KEY: "ci_test_secret_key_for_github_actions_validation_only"
          JWT_SECRET: "ci_test_secret_key_for_github_actions_validation_only"
          ENVIRONMENT: "testing"
        run: |
          python -c "import src.api.main; import src.database.models; import src.database.schemas; print('✅ FastAPI Application & Database Schemas loaded successfully')"

      - name: Run Sprint 3 Multi-Agent Test Suite
        env:
          PYTHONPATH: "."
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/wellness_test_db"
          SECRET_KEY: "ci_test_secret_key_for_github_actions_validation_only"
          JWT_SECRET: "ci_test_secret_key_for_github_actions_validation_only"
          ENVIRONMENT: "testing"
          GEMINI_API_KEY: "mock_gemini_ci_key"
          OPENROUTER_API_KEY: "mock_openrouter_ci_key"
        run: |
          pytest tests/ -v --ignore=tests/legacy/

  frontend-build:
    name: Frontend Build (React 18 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './src/app/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Production Bundle
        run: npm run build

  quality-security-audit:
    name: ISO 25010 & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Sanitization & Documentation Structure
        run: |
          echo "Verificando estructura de requisitos y arquitectura..."
          test -f docs/requirements/functional-requirements.md
          test -f docs/requirements/non-functional-requirements.md
          test -f docs/requirements/use-cases.md
          test -f docs/requirements/user-stories.md
          test -f docs/architecture/system-overview.md
          test -f docs/project/scope.md
          test -f .env.example
          echo "✅ Todos los artefactos de ingeniería de software están presentes y verificados."
