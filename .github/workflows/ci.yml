name: SeniorVital CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (FastAPI + Python)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Backend Integration & Unit Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock"
          JWT_SECRET: "ci_test_secret_key_for_github_actions_validation"
          ENVIRONMENT: "testing"
        run: |
          python -c "import app.main; print('FastAPI app imported successfully')"

  frontend-build:
    name: Frontend Build (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./seniorvital-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './seniorvital-frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Production Assets
        run: npm run build
