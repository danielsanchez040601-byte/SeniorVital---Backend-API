services:
  - type: web
    name: seniorvital-backend
    env: docker
    region: ohio
    plan: free
    autoDeploy: true
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEFAULT_LLM_MODEL
        value: inclusionai/ling-3.0-flash:free
